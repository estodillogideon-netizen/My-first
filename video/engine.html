<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:#000;overflow:hidden;font-family:'Segoe UI',Arial,sans-serif}
  #stage{position:relative;width:720px;height:1280px;overflow:hidden}
  canvas{display:block}
  .ov{position:absolute;pointer-events:none}
  #ui{top:40px;right:24px;width:340px;background:rgba(20,20,28,.72);border-radius:10px;color:#fff;font-size:28px;padding:12px 16px;display:none}
  #ui b{display:block;font-size:22px;color:#aab;margin-bottom:6px;letter-spacing:1px}
  #ui .row{padding:4px 0;border-top:1px solid rgba(255,255,255,.08)}
  #ui .bad{color:#ff5a5a;font-family:monospace}
  #sub{left:40px;right:40px;bottom:210px;text-align:center;color:#fff;font-size:40px;font-weight:800;
       text-shadow:0 0 8px #000,0 3px 0 #000,0 -2px 0 #000,3px 0 0 #000,-3px 0 0 #000;line-height:1.25}
  #title{inset:0;display:none;background:#000;color:#fff;text-align:center;flex-direction:column;justify-content:center;align-items:center}
  #title h1{font-size:68px;margin:0 40px;line-height:1.1;letter-spacing:2px}
  #title p{font-size:30px;color:#ff5a5a;letter-spacing:6px}
  #scan{inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 2px,transparent 2px 4px);opacity:0}
  #vig{inset:0;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.75) 100%)}
  #fade{inset:0;background:#000;opacity:0}
  #flash{inset:0;background:#fff;opacity:0}
  #chat{top:40px;left:24px;width:330px;background:rgba(20,20,28,.6);border-radius:10px;color:#fff;font-size:24px;padding:10px 14px;display:none;line-height:1.35}
  #chat .n{font-weight:800}
  #bubbles{inset:0}
  .bubble{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#111;font-size:30px;font-weight:700;
          padding:10px 18px;border-radius:18px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.35)}
  .bubble:after{content:'';position:absolute;left:50%;bottom:-12px;margin-left:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
  #center{left:60px;right:60px;top:66%;transform:translateY(-50%);text-align:center;display:none;background:rgba(15,15,20,.88);
          border:2px solid rgba(255,255,255,.15);border-radius:16px;color:#fff;padding:34px 20px;font-size:44px;font-weight:800;letter-spacing:1px}
  #center small{display:block;font-size:24px;color:#aab;font-weight:600;margin-top:10px}
</style></head>
<body><div id="stage">
  <div class="ov" id="vig"></div>
  <div class="ov" id="ui"></div>
  <div class="ov" id="bubbles"></div>
  <div class="ov" id="chat"></div>
  <div class="ov" id="center"></div>
  <div class="ov" id="scan"></div>
  <div class="ov" id="sub"></div>
  <div class="ov" id="title"></div>
  <div class="ov" id="fade"></div>
  <div class="ov" id="flash"></div>
</div>
<script type="module">
import * as THREE from './node_modules/three/build/three.module.js';
const params = new URLSearchParams(location.search);
const sceneName = params.get('scene') || 'scene1';
const W = 720, H = 1280;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.getElementById('stage').prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 500);
const timeline = await (await fetch(`./scenes/${sceneName}.json`)).json();
try { const tm = await (await fetch(`./out/${sceneName}.timing.json`)).json(); timeline.narration.forEach((n, i) => n.dur = tm[i]); } catch (e) {}
const mod = await import(`./scenes/${sceneName}.js`);
const $ = id => document.getElementById(id);
const ctx = { THREE, scene, camera, renderer, timeline, $, W, H };
mod.setup(ctx);

function subtitleAt(t) {
  const n = timeline.narration.find(n => t >= n.t && t < n.t + (n.dur || 3));
  return n ? n.text : '';
}
window.__duration = timeline.duration;
window.__render = (t) => {
  $('sub').textContent = subtitleAt(t);
  mod.frame(t, ctx);
  renderer.render(scene, camera);
  return true;
};
window.__ready = true;
// Live preview mode (open in a browser): plays in real time
if (params.get('preview')) { const t0 = performance.now(); (function loop(){ window.__render(((performance.now()-t0)/1000) % timeline.duration); requestAnimationFrame(loop); })(); }
</script></body></html>
